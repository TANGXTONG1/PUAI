 tokenUsage?'日志 token 总量：'+tokenUsage.total_tokens+(tokenUsage.coverage==='partial'?'（已核对部分）':'')+'。':'',
 tokenUsage&&!profile?'用量范围 '+tokenUsage.scope+'，缓存输入已包含。':'',
 reviewed!==null&&percent!==null?'已核验的'+edition.keyword+'指令：'+reviewed+' / '+s.messages+' 条，约占 '+percent+'%。':'',
 ...dailySummary,
 partialCalendar?'日历选展了其中三个活跃月份。':'',
 !profile&&rhythm?.criteria?'按 '+a.timezone+' 去重。首个密集月须有至少 '+rhythm.criteria.min_active_days+' 个活跃日，跨 '+rhythm.criteria.min_active_weeks+' 个自然周。'+(unclassified?'':'占比按整个分析期的用户消息数计算，')+'缺记录的日期不计作停用。':'',
 ...months.map(m=>m.month+'：'+m.messages+' 条指令'+(monthHits(m)!==null?'，其中 '+monthHits(m)+' 条与'+edition.keyword+'相关':'')),

].filter(Boolean).join(newline);

const extraNotes=quotes.length||lead?[...personaSummary,...distinctHabits.filter(habit=>!posterHabits.includes(habit)),...scenes.slice(posterScenes.length).map(s=>s.text)]:[];
