<script>
const viewer=document.getElementById('viewer'),full=document.getElementById('full');
const links=[...document.querySelectorAll('.sheet')],pane=viewer.querySelector('.viewport');
const prev=document.getElementById('prev'),next=document.getElementById('next'),save=document.getElementById('download');
let active=0,opener;
const alternate=document.querySelector('.variant');
function select(link) {
  const figure=link.closest('figure'),main=figure.querySelector('.sheet');
  const label=figure.dataset.title+(link===alternate?'（钴蓝）':'');
  active=links.indexOf(main);
  document.getElementById('viewTitle').textContent=label;
  full.width=900;
  full.height=Number(link.dataset.height || main.querySelector('img').getAttribute('height'));
  full.src=link.href;full.alt=main.querySelector('img').alt;
  save.href=link.href;
  save.download=link===alternate?'PUAI-唐某-钴蓝.png':figure.querySelector('.save').download;
  prev.disabled=active===0;next.disabled=active===links.length-1;
  pane.scrollTop=0;
}
function openLink(link) {
  select(link);
  if(viewer.open)return;
  opener=link;
  viewer.showModal();
  document.documentElement.classList.add('browsing');
  document.getElementById('close').focus({preventScroll:true});
}
function linkedSheet() {
  if(location.hash==='#puai-cobalt')return alternate;
  return links.find(link=>'#'+link.closest('figure').id===location.hash);
}
function targetHash(link) {
  return '#'+(link.dataset.variant || link.closest('figure').id);
}
function syncLocation() {
  const link=linkedSheet();
  if(link)openLink(link);
  else if(viewer.open)viewer.close();
}
function closeFromViewer() {
  if(history.state?.puaiViewer && linkedSheet()) {
    history.back();
    return;
  }
  if(linkedSheet())history.replaceState(history.state,'',location.pathname+location.search);
  viewer.close();
}
function flip(step) {
  const link=links[active+step];
  if(!link)return;
  history.replaceState(history.state,'',targetHash(link));
  select(link);
}
if(typeof viewer.showModal==='function') {
  [...links,alternate].forEach(link=>link.addEventListener('click',event=>{
    if(event.metaKey||event.ctrlKey||event.shiftKey||event.altKey||event.button!==0)return;
    event.preventDefault();
    history.pushState({puaiViewer:true},'',targetHash(link));
    openLink(link);
  }));
  prev.addEventListener('click',()=>flip(-1));next.addEventListener('click',()=>flip(1));
  document.getElementById('close').addEventListener('click',closeFromViewer);
  viewer.addEventListener('cancel',event=>{event.preventDefault();closeFromViewer()});
  viewer.addEventListener('keydown',event=>{
    if(event.key==='ArrowLeft'){event.preventDefault();flip(-1)}
    if(event.key==='ArrowRight'){event.preventDefault();flip(1)}
  });
  viewer.addEventListener('close',()=>{
    if(viewer.open)return;
    document.documentElement.classList.remove('browsing');
    opener?.focus({preventScroll:true});
  });
  window.addEventListener('hashchange',syncLocation);
  syncLocation();
}
</script><script src="../metrics-consent.js"></script>
