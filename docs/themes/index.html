<script>
const viewer=document.getElementById('viewer'),full=document.getElementById('full');
const links=[...document.querySelectorAll('.sheet')],pane=viewer.querySelector('.viewport');
const prev=document.getElementById('prev'),next=document.getElementById('next'),save=document.getElementById('download');
let active=0,opener;
function show(index) {
  if(index<0||index>=links.length)return;
  active=index;
  const link=links[index],label=link.closest('figure').dataset.title;
  document.getElementById('viewTitle').textContent=label;
  full.width=900;full.height=Number(link.querySelector('img').getAttribute('height'));
  full.src=link.href;full.alt=label+'年度报告完整长图';save.href=link.href;save.download='PUAI-'+label+'.png';
  prev.disabled=index===0;next.disabled=index===links.length-1;pane.scrollTop=0;
}
if(typeof viewer.showModal==='function') {
  links.forEach((link,i)=>link.addEventListener('click',event=>{
    if(event.metaKey||event.ctrlKey||event.shiftKey||event.altKey||event.button!==0)return;
    event.preventDefault();opener=link;show(i);viewer.showModal();document.documentElement.classList.add('browsing');
    document.getElementById('close').focus({preventScroll:true});
  }));
  prev.addEventListener('click',()=>show(active-1));next.addEventListener('click',()=>show(active+1));
  document.getElementById('close').addEventListener('click',()=>viewer.close());
  viewer.addEventListener('keydown',event=>{
    if(event.key==='ArrowLeft'){event.preventDefault();show(active-1)}
    if(event.key==='ArrowRight'){event.preventDefault();show(active+1)}
  });
  viewer.addEventListener('close',()=>{
    document.documentElement.classList.remove('browsing');opener?.focus({preventScroll:true});
  });
}
</script><script src="../metrics-consent.js"></script>
