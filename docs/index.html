atus{min-height:25px;color:var(--red);font-size:14px;margin:10px 0 2px}.how{font-size:14px;line-height:1.8;color:var(--muted);margin:0 0 28px}.how a{text-underline-offset:4px}.content-list{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 28px;padding:0;list-style:none}.content-list li{font-weight:600;border-bottom:2px solid var(--ink);padding:5px 0;margin-right:12px}.note{font-size:14px;line-height:1.8;color:var(--muted);border-top:1px solid var(--line);padding-top:20px}figure{margin:0;position:relative;padding-top:16px}figure::before{content:"就长这样";position:absolute;top:-9px;right:12px;background:var(--red);color:white;padding:8px 18px;font-weight:750;font-size:16px;transform:rotate(5deg);z-index:1}.preview-link{display:block;border:2px solid var(--ink);background:var(--paper)}figure img{display:block;width:100%;height:auto}figcaption{font-size:13px;line-height:1.6;color:var(--muted);padding:14px 0}footer{border-top:1px solid var(--line);max-width:1124px;margin:0 auto;padding:24px 0 40px;display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}footer a{text-underline-offset:4px}@media(max-width:760px){header{padding:20px}.layout{grid-template-columns:1fr;gap:40px;padding:20px 20px 40px}.intro{padding-top:8px}h1{font-size:clamp(29px,8.6vw,36px);letter-spacing:-1px}.lead{font-size:18px;margin-bottom:26px}nav{font-size:14px;gap:14px}.copy,.download{font-size:17px;padding:15px 18px}figure{max-width:460px;margin:auto}footer{margin:0 20px;display:block;line-height:2}footer a{display:block;margin-top:4px}.note{margin-bottom:0}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
.prompt{margin:16px 0}.status:empty{display:none}.signature{margin:0 0 18px}.signature summary{font-size:15px;font-weight:650;cursor:pointer;width:fit-content}.signature .name-row{max-width:410px;margin:12px 0}.signature .name-row label{margin:0;padding-left:14px;white-space:nowrap}.signature summary:focus-visible{outline:3px solid var(--red);outline-offset:4px}
