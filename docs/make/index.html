<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#fff7ed">
  <title>生成我的 AI 年度相处报告 · PUAI</title>
  <style>
    :root{color-scheme:light;--paper:#fff7ed;--ink:#231e1a;--signal:#ff4539;--muted:#665b52}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "PingFang SC","Microsoft YaHei",system-ui,sans-serif}
    main{width:min(100%,600px);margin:auto;padding:22px 18px 44px}
    nav,.heading{display:flex;align-items:center;justify-content:space-between;gap:12px}
    nav{padding-bottom:17px;border-bottom:1px solid var(--ink)}
    a{color:inherit;text-underline-offset:3px}
    .brand{font:900 22px/1 Arial,sans-serif;letter-spacing:-.04em;text-decoration:none}
    .home{font-size:15px}
    h1{font-size:clamp(25px,6vw,34px);line-height:1.18;letter-spacing:-.045em;margin:0}
    .heading{margin:22px 0 14px}
    #form{margin-top:24px}
    label{display:block;font-size:17px;font-weight:650;margin-bottom:8px}
    textarea{display:block;width:100%;border:1px solid var(--ink);border-radius:3px;font:inherit;padding:12px;color:var(--ink);resize:vertical;background:#fffdf8}
    .action{display:inline-block;cursor:pointer;color:#fff;background:var(--ink);padding:11px 16px;font-family:inherit;font-size:16px;line-height:1.3;font-weight:650;border:1px solid var(--ink);border-radius:3px;text-decoration:none;white-space:nowrap}
    #form .action{margin-top:12px}
    #recovery{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:16px 0}
    .link-button{border:0;background:none;color:inherit;font:inherit;text-decoration:underline;text-underline-offset:3px;padding:8px 0;cursor:pointer}
    a:focus-visible,button:focus-visible,textarea:focus-visible{outline:3px solid #a12937;outline-offset:3px}
    #status{color:var(--muted);margin:10px 0}
    #status:empty{display:none}
    #status.error{color:#9b241a}
    #preview{display:block;width:100%;height:auto;border:1px solid #e6dbd0}
    #fallback-copy{color:var(--muted);font-size:14px;margin:0 0 18px}
    [hidden]{display:none!important}
  </style>
</head>
<body>
<main>
  <nav aria-label="PUAI"><a class="brand" href="../">PUAI</a><a class="home" href="../">获取 ChatGPT 口令</a></nav>
  <div class="heading"><h1 id="title">我的年度报告</h1><a class="action" id="save" hidden>保存长图</a></div>
  <p id="status" role="status" aria-live="polite"></p>
  <div id="recovery" hidden>
    <button class="action" id="retry" type="button" hidden>重新加载</button>
    <button class="link-button" id="recover" type="button" aria-controls="form" aria-expanded="false">使用备用报告码</button>
  </div>
  <form id="form" hidden>
    <label for="code">粘贴 GPT 给你的报告码或完整链接</label>
    <textarea id="code" rows="4" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="v2｜…" maxlength="48000" required></textarea>
    <button class="action" type="submit">生成长图</button>
  </form>
  <section id="result" hidden>
    <p id="fallback-copy">也可以长按图片保存。</p>
    <img id="preview" alt="">
  </section>
  <noscript>请用启用了 JavaScript 的浏览器打开页面生成长图。</noscript>
</main>
<script type="module" src="./make.js?v=ca0c085a78"></script>
</body>
</html>
