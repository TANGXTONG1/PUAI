<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#fff7ed">
  <title>生成我的 AI 年度相处报告 · PUAI</title>
  <style>
    :root{color-scheme:light;--paper:#fff7ed;--ink:#231e1a;--signal:#ff4539;--muted:#665b52}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "PingFang SC","Microsoft YaHei",system-ui,sans-serif}
    main{width:min(100%,600px);margin:auto;padding:22px 18px 44px}
    nav,.heading{display:flex;align-items:center;justify-content:space-between;gap:12px}
    nav{padding-bottom:17px;border-bottom:1px solid var(--ink)}
    a{color:inherit;text-underline-offset:3px}
    .brand{font:900 22px/1 Arial,sans-serif;letter-spacing:-.04em;text-decoration:none}
    .home{font-size:15px}
    h1{font-size:clamp(25px,6vw,34px);line-height:1.18;letter-spacing:-.045em;margin:0}
    .heading{margin:22px 0 14px}
    #form{margin-top:22px}
    #how{margin:0 0 12px;color:var(--muted)}
    #paste{width:100%;text-align:center;margin:0 0 20px}
    #manual label{font-size:15px}
    #repair{margin:14px 0}
    #repair-text{margin-top:10px}
    #partial{margin:14px 0;padding:14px 16px;border-left:3px solid var(--ink);background:#fffdf8}
    #partial p{margin:0 0 8px}
    #partial-text{font-weight:650;overflow-wrap:anywhere}
    label{display:block;font-size:17px;font-weight:650;margin-bottom:8px}
    textarea{display:block;width:100%;border:1px solid var(--ink);border-radius:3px;font:inherit;padding:12px;color:var(--ink);resize:vertical;background:#fffdf8}
    .action{display:inline-block;cursor:pointer;color:#fff;background:var(--ink);padding:11px 16px;font-family:inherit;font-size:16px;line-height:1.3;font-weight:650;border:1px solid var(--ink);border-radius:3px;text-decoration:none;white-space:nowrap}
    #form .action{margin-top:12px}
    #recovery{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:16px 0}
    .link-button{border:0;background:none;color:inherit;font:inherit;text-decoration:underline;text-underline-offset:3px;padding:8px 0;cursor:pointer}
    a:focus-visible,button:focus-visible,textarea:focus-visible{outline:3px solid #a12937;outline-offset:3px}
    #status{color:var(--muted);margin:10px 0}
    #status:empty{display:none}
    #status.error{color:#9b241a}
    .poster-sheet{position:relative}
    .claim-footer{position:absolute;inset:auto 1px 1px;aspect-ratio:900/228}
    .claim-footer:focus-visible{outline-offset:-3px}
    #preview{display:block;width:100%;height:auto;border:1px solid #e6dbd0}
    #preview-actions{display:flex;gap:8px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:0 0 16px}
    #fallback-copy{color:var(--muted);font-size:14px;margin:0}
    #dates-text,#share-text{margin:0 0 16px}
    #share{color:var(--ink);background:transparent;padding:7px 12px}
    [hidden]{display:none!important}
  </style>
<link rel="stylesheet" href="../metrics-consent.css">
</head>
<body data-puai-surface="make">
<main>
  <nav aria-label="PUAI"><a class="brand" href="../">PUAI</a><a class="home" href="../#go">领取生成口令</a></nav>
  <div class="heading"><h1 id="title">我的年度报告</h1><a class="action" id="save" data-puai-action="save_report" hidden>保存长图</a></div>
  <p id="status" role="status" aria-live="polite"></p>
  <div id="recovery" hidden>
    <button class="action" id="retry" type="button" hidden>重新加载</button>
    <button class="link-button" id="recover" type="button" aria-controls="form" aria-expanded="false">粘贴助手回复</button>
  </div>
  <form id="form" hidden>
    <p id="how">先在聊天里复制助手的报告，回到这里出图。</p>
    <button class="action" id="paste" data-puai-action="generate_report" type="button">粘贴并生成长图</button>
    <div id="manual">
      <label for="code">或在这里粘贴助手的回复</label>
      <textarea id="code" rows="3" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="也支持旧报告码和完整链接" maxlength="48000" required></textarea>
      <button class="link-button" type="submit" data-puai-action="generate_report">生成长图</button>
    </div>
  </form>
  <div id="partial" hidden>
    <p>这条旧回复里能还原的用法</p>
    <p id="partial-text"></p>
    <button id="use-partial" data-puai-action="generate_report" class="action" type="button">用这条做图</button>
  </div>
  <div id="repair" hidden>
    <button id="repair-copy" class="link-button" type="button">复制指令，回原聊天补全报告</button>
    <textarea id="repair-text" aria-label="回原聊天补全报告的指令" rows="4" readonly hidden></textarea>
  </div>
  <section id="result" hidden>
    <div id="preview-actions">
      <button class="action" id="share" data-puai-action="share_report" type="button">复制转发语</button>
      <p id="fallback-copy">也可以长按图片保存。</p>
      <button type="button" class="link-button" id="dates-copy" data-skill="https://raw.githubusercontent.com/TANGXTONG1/PUAI/main/SKILL.md?v=17" hidden>复制补日期口令</button>
    </div>
    <textarea id="share-text" aria-label="同款报告转发语" rows="3" readonly hidden></textarea>
    <textarea id="dates-text" aria-label="回原对话补查日期的口令" rows="3" readonly hidden></textarea>
    <div class="poster-sheet">
      <img id="preview" alt="">
      <a class="claim-footer" href="../#go" aria-label="领取同款生成口令"></a>
    </div>
  </section>
  <noscript>请用启用了 JavaScript 的浏览器打开页面生成长图。</noscript>
<footer class="puai-privacy-foot"><button type="button" data-puai-privacy>统计设置</button></footer>
</main>
<script type="module" src="./make.js?v=d2898017d9"></script>
<script src="../metrics-consent.js"></script>
<script src="../metrics.js"></script>
</body>
</html>
