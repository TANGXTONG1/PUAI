<script id="data" type="application/json">{"palettes":{"N05":{"label":"白瓷钴蓝"},"N06":{"label":"铝板信号橙"},"N07":{"label":"离子薄荷"},"N08":{"label":"洋红校样"}},"themes":{"puai":{"id":"puai","default":"N05","label":"PUAI","source":"唐某原话"},"hush":{"id":"hush","default":"N07","label":"AI在心口难开","source":"场景示意"},"aicu":{"id":"aicu","default":"N06","label":"AICU","source":"场景示意"},"teach":{"id":"teach","default":"N05","label":"AI的教育","source":"场景示意"},"all":{"id":"all","default":"N08","label":"AI特全体","source":"场景示意"},"einstein":{"id":"einstein","default":"N05","label":"AI因斯坦","source":"场景示意"},"edison":{"id":"edison","default":"N06","label":"AI迪生","source":"场景示意"},"support":{"id":"support","default":"N08","label":"AI的供养","source":"场景示意"},"free":{"id":"free","default":"N07","label":"AI咋咋地","source":"场景示意"}}}</script><script>
(()=>{
  const data=JSON.parse(document.getElementById('data').textContent);
  const toolbar=document.getElementById('controls');
  const buttons=[...toolbar.querySelectorAll('button')];
  const cards=[...document.querySelectorAll('figure[data-theme]')];
  function selected(){
    const key=new URL(location.href).searchParams.get('color');
    return Object.hasOwn(data.palettes,key)?key:'default';
  }
  function paint(){
    const mode=selected();
    buttons.forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.mode===mode)));
    cards.forEach(card=>{
      const theme=data.themes[card.dataset.theme];
      const code=mode==='default'?theme.default:mode;
      const palette=data.palettes[code];
      const base=theme.id+'-'+code;
      const full='full/'+base+'.png?v=light3';
      const img=card.querySelector('img');
      const next='strips/'+base+'.webp?v=light3';
      if(img.getAttribute('src')!==next) img.setAttribute('src',next);
      const desc=theme.label+' · '+code+' '+palette.label;
      img.alt=desc+'，'+theme.source;
      card.querySelectorAll('[data-full]').forEach(a=>{
        a.setAttribute('href',full);
        a.setAttribute('aria-label','打开'+desc+'完整长图');
      });
      card.querySelector('.cardcode').textContent=code;
      card.querySelector('.pname').textContent=palette.label;
    });
    document.getElementById('status').textContent=mode==='default'?'按主题展示主选搭配':'已切换为'+data.palettes[mode].label;
  }
  toolbar.addEventListener('click',event=>{
    const btn=event.target.closest('button[data-mode]');
    if(!btn||btn.dataset.mode===selected())return;
    const url=new URL(location.href);
    if(btn.dataset.mode==='default')url.searchParams.delete('color');
    else url.searchParams.set('color',btn.dataset.mode);
    history.pushState(null,'',url);
    paint();
  });
  addEventListener('popstate',paint);
  paint(); toolbar.hidden=false;
})();
</script></body></html>
