.overview{color:var(--ink);font-weight:650;display:inline-flex;gap:7px;align-items:center;min-height:40px;white-space:nowrap}
.index{list-style:none;margin:0 0 40px;padding:0;display:grid;grid-template-columns:repeat(var(--columns),minmax(0,1fr));gap:2px}

.index-info{padding:10px 10px 10px 13px;display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.series-name{font-size:clamp(14px,1.4vw,17px);font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.index-color{width:22px;height:14px;display:inline-block;position:relative;margin-left:auto;flex:none;background:var(--accent)}

.group{margin-bottom:55px}.section-top{display:flex;align-items:baseline;gap:15px;margin-bottom:16px}

.proof{min-width:0;scroll-margin-top:12px}
.visual{display:block;background:var(--paper);position:relative}.visual img{display:block;width:100%;height:auto}
figcaption{padding:11px 0 0}.name-row,.info-row,.tools{display:flex;align-items:baseline;gap:10px}
.name-row{align-items:center;justify-content:space-between}.title{display:flex;align-items:baseline;gap:10px;min-width:0}
.code{font:600 14px var(--body);letter-spacing:.01em;white-space:nowrap;text-decoration:none;border-bottom:1px dotted var(--faded)}
h3{font:650 clamp(20px,2.05vw,26px)/1.25 var(--body);overflow-wrap:anywhere;letter-spacing:-.035em}
.inks{display:inline-flex;flex:none;align-items:stretch;height:13px;width:70px;border:1px solid #858b80}.inks i{flex:1}
.credit{color:var(--faded);margin-top:5px;font-size:14px;line-height:1.4;overflow-wrap:anywhere}
.credit a{text-decoration-style:dotted}.credit a:hover{text-decoration-style:solid}
.info-row{justify-content:space-between;align-items:flex-start}.info-row .credit{flex:1}
.full{font-size:14px;min-height:36px;line-height:1.4;flex:none;margin-top:4px}.full span,.overview span{font:400 1em var(--body)}
footer{padding:0 0 32px;color:var(--faded);font-size:14px}footer p{padding-top:13px;border-top:1px solid var(--rule)}
@media(max-width:700px){.index{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:28px}.grid{grid-template-columns:1fr;gap:22px}.group{margin-bottom:39px}.hero{gap:10px;padding:24px 0 16px;align-items:center}.overview{font-size:14px;gap:4px}.section-top{margin-bottom:11px}.inks{width:60px}.owner{font-size:13px}.full{padding:4px 0 4px 5px;margin-top:0}.mast{padding-block:6px}.credit{font-size:13px}.grid .proof+ .proof{border-top:1px solid var(--rule);padding-top:17px}.index-info{padding:9px 8px 9px 10px}}
